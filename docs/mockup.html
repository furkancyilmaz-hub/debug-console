<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poliçe Konsolu — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEFEA;
  --card:#FFFFFF;
  --rule:#DCDCD4;
  --rule-soft:#E8E8E2;
  --ink:#1A1C19;
  --ink-2:#5C6159;
  --ink-3:#8E938A;
  --mark:#2F4B3F;
  --mark-soft:#E3EAE5;
  --heat:#B4532A;
  --heat-2:#8C2F1E;
  --heat-soft:#F6E7DF;
  --calm:#4B7A5E;
  --calm-soft:#E4EFE8;
  --r:2px;
  --dock:210px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600}

/* ── shell ───────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh}
.top{
  display:flex;align-items:center;gap:26px;height:48px;padding:0 20px;
  background:var(--card);border-bottom:1px solid var(--rule);flex-shrink:0;
}
.brand{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  letter-spacing:.08em;font-size:13px;text-transform:uppercase;
}
.brand i{color:var(--mark);font-style:normal;margin-right:7px}
.tabs{display:flex;gap:2px}
.tab{
  padding:5px 13px;border-radius:var(--r);font-weight:500;font-size:13px;
  color:var(--ink-2);
}
.tab:hover{background:var(--paper)}
.tab.on{background:var(--mark);color:#fff}
.svc{margin-left:auto;display:flex;gap:15px;font-size:11px;color:var(--ink-3)}
.svc span{display:flex;align-items:center;gap:5px}
.svc i{width:5px;height:5px;border-radius:50%;background:var(--calm);display:block}

.main{flex:1;overflow-y:auto;padding:20px 20px 26px}
.wrap{max-width:1080px;margin:0 auto}

/* ── breadcrumb + heads ──────────────────────────────── */
.crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);margin-bottom:14px}
.crumb button{color:var(--mark);font-size:11.5px}
.crumb button:hover{text-decoration:underline}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px}
.pagehead h1{font-size:20px;letter-spacing:-.01em}
.pagehead p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}

/* ── controls ────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.field{
  border:1px solid var(--rule);background:var(--card);border-radius:var(--r);
  padding:6px 9px;font-size:13px;min-width:170px;
}
.field:focus{outline:none;border-color:var(--mark)}
.btn{
  border:1px solid var(--rule);background:var(--card);border-radius:var(--r);
  padding:6px 12px;font-size:12.5px;font-weight:500;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--mark);border-color:var(--mark);color:#fff}
.btn.primary:hover{background:#263D33}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{padding:6px 12px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--mark);color:#fff}

/* ── table ───────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
thead th{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);
  white-space:nowrap;user-select:none;
}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--ink)}
thead th .car{margin-left:4px;color:var(--mark)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--rule-soft);font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--paper)}
.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.skel{display:block;height:11px;border-radius:2px;background:var(--rule-soft);animation:sk 1.1s ease-in-out infinite}
@keyframes sk{50%{opacity:.45}}

.pill{
  display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;
  font-weight:500;letter-spacing:.02em;border:1px solid transparent;
}
.pill.ok{background:var(--calm-soft);color:var(--calm);border-color:#CBDFD3}
.pill.warn{background:var(--heat-soft);color:var(--heat);border-color:#EBD2C5}
.pill.mute{background:var(--paper);color:var(--ink-3);border-color:var(--rule)}

.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 12px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-2);
}
.pager{display:flex;align-items:center;gap:6px}
.pager button{border:1px solid var(--rule);border-radius:var(--r);padding:3px 9px;font-size:12px;background:var(--card)}
.pager button:disabled{opacity:.4}

.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:12.5px}
.empty b{display:block;color:var(--ink-2);font-weight:500;margin-bottom:4px;font-size:13.5px}

/* ── detail ──────────────────────────────────────────── */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule-soft)}
.dl div{background:var(--card);padding:11px 13px}
.dl dt{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.dl dd{margin:0;font-size:14px}
.sec{margin-top:20px}
.sec > .lbl{display:block;margin-bottom:8px}

/* ── form ────────────────────────────────────────────── */
.form{max-width:420px}
.row{margin-bottom:14px}
.row label{display:block;font-size:12px;font-weight:500;margin-bottom:4px}
.row .field{width:100%}
.row .field.bad{border-color:var(--heat-2);background:#FEF8F6}
.err{display:flex;gap:5px;margin-top:4px;font-size:11.5px;color:var(--heat-2)}
.err::before{content:"▲";font-size:8px;line-height:1.5}

/* ── inspector dock ──────────────────────────────────── */
.dock{
  flex-shrink:0;background:var(--card);border-top:1px solid var(--rule);
  display:flex;flex-direction:column;height:var(--dock);transition:height .18s;
}
.dock.min{height:37px}
.dockbar{
  display:flex;align-items:center;gap:10px;padding:0 14px;height:36px;
  border-bottom:1px solid var(--rule-soft);flex-shrink:0;
}
.dockbar .lbl{cursor:pointer}
.dockbar .caret{font-size:9px;color:var(--ink-3);margin-right:2px}
.dockstat{font-size:11.5px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.dockact{margin-left:auto;display:flex;gap:6px}
.dockact button{border:1px solid var(--rule);border-radius:var(--r);padding:3px 9px;font-size:11.5px;background:var(--card)}
.dockact button.on{background:var(--mark);border-color:var(--mark);color:#fff}
.dockbody{overflow-y:auto;flex:1}
.dock.min .dockbody{display:none}
.req{
  display:grid;grid-template-columns:62px 46px 1fr 42px 130px 66px;
  gap:10px;align-items:center;padding:4px 14px;font-size:11.5px;
  border-bottom:1px solid var(--rule-soft);cursor:pointer;
  animation:slide .22s ease-out;
}
@keyframes slide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.req:hover{background:var(--paper)}
.req .m{font-weight:600;color:var(--ink-2);font-size:10.5px}
.req .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"IBM Plex Mono",monospace}
.req .s{color:var(--calm);font-family:"IBM Plex Mono",monospace}
.req .track{height:9px;background:var(--rule-soft);border-radius:1px;overflow:hidden}
.req .track i{display:block;height:100%;border-radius:1px}
.req .ms{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.req.slow .ms{color:var(--heat-2);font-weight:600}
.cid{
  grid-column:1/-1;padding:2px 0 5px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;display:none;
}
.req.open .cid{display:block}

/* ── analiz ──────────────────────────────────────────── */
.stages{padding:4px 0}
.stage{
  display:grid;grid-template-columns:20px 120px 58px 1fr 170px 54px;
  gap:11px;align-items:center;padding:6px 14px;font-size:12.5px;
  animation:slide .25s ease-out;
}
.stage .st{color:var(--calm);font-size:11px}
.stage .nm{font-family:"IBM Plex Mono",monospace;font-weight:500}
.stage .note{color:var(--ink-2);font-size:12px}
.stage .track{height:10px;background:var(--rule-soft);border-radius:1px;overflow:hidden}
.stage .track i{display:block;height:100%;background:var(--mark);border-radius:1px;
  animation:grow .45s cubic-bezier(.2,.8,.3,1);transform-origin:left}
.stage.model .track i{background:var(--heat)}
@keyframes grow{from{transform:scaleX(.03)}to{transform:scaleX(1)}}
.stage .ms{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--rule);
  border-top-color:var(--mark);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--rule-soft)}
.summary div{background:var(--card);padding:11px 13px}
.summary .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.summary .k{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.summary .v.hot{color:var(--heat-2)}
.summary .v.good{color:var(--calm)}

.finding{border-bottom:1px solid var(--rule-soft)}
.finding:last-child{border-bottom:0}
.fhead{
  display:grid;grid-template-columns:14px 1fr 190px 74px 78px;gap:11px;align-items:center;
  width:100%;padding:10px 13px;text-align:left;
}
.fhead:hover{background:var(--paper)}
.fhead .car{color:var(--ink-3);font-size:9px}
.fhead .ep{font-family:"IBM Plex Mono",monospace;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .rel{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2)}
.fhead .cnt{font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:right;color:var(--heat-2)}
.finding.med .fhead .cnt{color:var(--heat)}
.fbody{display:none;padding:0 13px 16px 38px}
.finding.open .fbody{display:block}
.finding.open .fhead{background:var(--paper)}

.measure{border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--rule-soft)}
.mgrid div{background:var(--card);padding:9px 11px}
.mgrid .k{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.mgrid .v{font-family:"IBM Plex Mono",monospace;font-size:13px}
.sql{
  margin:0;padding:10px 11px;border-top:1px solid var(--rule-soft);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.65;
  color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
}
.sql b{color:var(--ink);font-weight:500}

.ai{
  margin-top:12px;padding:12px 13px;background:var(--mark-soft);
  border-left:2px solid var(--mark);border-radius:0 var(--r) var(--r) 0;
}
.ai .lbl{color:var(--mark);margin-bottom:6px;display:block}
.ai p{margin:0 0 10px;font-size:13px;line-height:1.55}
.fix{background:var(--card);border:1px solid #CBD8CF;border-radius:var(--r);padding:9px 11px}
.fix code{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.6;margin-bottom:8px}
.fixmeta{display:grid;grid-template-columns:78px 1fr;gap:3px 11px;font-size:11.5px}
.fixmeta dt{color:var(--ink-3)}
.fixmeta dd{margin:0;color:var(--ink-2)}
.fixmeta dd.exp{color:var(--heat-2);font-family:"IBM Plex Mono",monospace}
.copy{border:1px solid var(--rule);border-radius:var(--r);padding:2px 8px;font-size:10.5px;background:var(--paper)}

.switch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);cursor:pointer}
.sw{position:relative;width:32px;height:17px;border-radius:9px;border:1px solid var(--rule);background:var(--paper);flex-shrink:0;transition:.16s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink-3);transition:.16s}
.sw.on{background:var(--mark-soft);border-color:var(--mark)}
.sw.on::after{left:17px;background:var(--mark)}


.note{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.6}

@media (max-width:820px){
  .req{grid-template-columns:52px 1fr 60px}
  .req .s,.req .track{display:none}
  .stage{grid-template-columns:18px 1fr 56px}
  .stage .note,.stage .track{display:none}
  .fhead{grid-template-columns:14px 1fr 66px}
  .fhead .rel,.fhead .conf{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand"><i>⬡</i>Poliçe Konsolu</div>
  <nav class="tabs">
    <button class="tab on" data-nav="crud">CRUD</button>
    <button class="tab" data-nav="analiz">Analiz</button>
  </nav>
  <div class="svc">
    <span><i></i>demo-api</span>
    <span><i></i>debug-agent</span>
  </div>
</header>

<div class="main"><div class="wrap" id="view"></div></div>

<section class="dock" id="dock">
  <div class="dockbar">
    <button class="lbl" id="dockToggle"><span class="caret" id="caret">▼</span>İstekler</button>
    <span class="dockstat" id="dockStat">henüz istek yok</span>
    <div class="dockact">
      <button id="fSlow">yalnızca yavaşlar</button>
      <button id="fClear">temizle</button>
      <button class="btn primary" id="fAnalyze" style="padding:3px 10px;font-size:11.5px">bu istekleri analiz et</button>
    </div>
  </div>
  <div class="dockbody" id="dockBody"></div>
</section>

</div>

<script>
/* ══ veri (mockup) ══════════════════════════════════════ */
const CITIES=["Ankara","İzmir","Bursa","Konya","Adana","Trabzon","Eskişehir","Antalya","Samsun","Denizli"];
const NAMES=["Ahmet Yılmaz","Fatma Kaya","Mehmet Demir","Ayşe Çelik","Mustafa Şahin","Zeynep Yıldız","Ali Öztürk","Emine Aydın","Hüseyin Doğan","Hatice Kılıç","Osman Arslan","Elif Çetin","Yusuf Kara","Meryem Koç","Murat Şimşek"];

const PROPOSALS=Array.from({length:12},(_,i)=>({
  id:i+1,
  no:"TEK-2026-"+String(i+1).padStart(6,"0"),
  status:["APPROVED","DRAFT","REJECTED","APPROVED","APPROVED","DRAFT"][i%6],
  date:`2026-0${(i%6)+1}-${String(4+i).padStart(2,"0")}`,
  premium:(4200+i*3170)%88000+1200,
  customers:3+(i%4)
}));
const CUSTOMERS=Array.from({length:15},(_,i)=>({
  id:i+1,
  name:NAMES[i],
  city:CITIES[i%CITIES.length],
  status:i%5===0?"PASSIVE":"ACTIVE",
  proposalId:(i%12)+1,
  payments:2+(i%3),
  total:(1400+i*870)%9800+300
}));
const PAYMENTS=(cid)=>Array.from({length:2+(cid%3)},(_,n)=>({
  id:cid*10+n,
  amount:(320+cid*137+n*211)%4200+250,
  due:`2026-0${(n%6)+3}-${String(9+n*4).padStart(2,"0")}`,
  status:["PAID","PENDING","OVERDUE","PAID"][(cid+n)%4]
}));

/* uç → gecikme (ms). Naif uçlar belirgin şekilde yavaş. */
const LAT={
  "/proposals":28,"/proposals/{id}":19,"/proposals/detail":642,
  "/customers":31,"/customers/search":47,"/customers/detail":1180,
  "/customers/{id}/payments":22,"/customers/overview":38,"POST /proposals":54
};

const STAGES=[
  {n:"loglar",        kind:"LOCAL", ms:310, note:"892 satır çekildi"},
  {n:"ayrıştırma",    kind:"LOCAL", ms:440, note:"871 sorgu · 4 ayrıştırılamadı"},
  {n:"tespit",        kind:"LOCAL", ms:80,  note:"3 bulgu"},
  {n:"zenginleştirme",kind:"MODEL", ms:3900,note:"sonnet · 1 çağrı"}
];

const FINDINGS=[
  { id:"f1", ep:"GET /customers/detail", cid:"c9f2a1-04be",
    parent:"customer", child:"payment", fk:"payment.customer_id → customer.id",
    repeat:214, distinct:214, conf:"HIGH",
    sql:"select p1_0.id, p1_0.amount, p1_0.due_date, p1_0.status\nfrom payment p1_0\nwhere p1_0.customer_id = ?",
    binds:["104","217","318","…"],
    ai:"Müşteri listesi dönerken her müşterinin ödemeleri ayrı bir sorguyla çekiliyor. Bağlanan müşteri numaraları tamamen farklı, yani her satır için bir kez gidiliyor — klasik N+1.",
    fix:{action:"@EntityGraph(attributePaths = \"payments\")\nPage<Customer> findAll(Pageable pageable);",
         exp:"sorgu sayısı 214 → 2",
         risk:"Sayfalama ile birlikte kullanıldığında Hibernate bellekte sayfalayabilir; sayfa boyutunu ölç.",
         alt:"@BatchSize(size = 50) — daha az invaziv, 214 → 6"} },

  { id:"f2", ep:"GET /proposals/detail", cid:"c9f2a1-11d7",
    parent:"proposal", child:"customer", fk:"customer.proposal_id → proposal.id",
    repeat:48, distinct:48, conf:"HIGH",
    sql:"select c1_0.id, c1_0.full_name, c1_0.city, c1_0.status\nfrom customer c1_0\nwhere c1_0.proposal_id = ?",
    binds:["1","2","3","…"],
    ai:"Teklif listesi dönerken her teklifin müşterileri tek tek çekiliyor. Aynı desen, farklı tablo çifti.",
    fix:{action:"select p from Proposal p join fetch p.customers",
         exp:"sorgu sayısı 48 → 1",
         risk:"Join fetch kartezyen çarpım üretir; teklif başına müşteri sayısı büyürse satır sayısını ölç.",
         alt:"@BatchSize(size = 25)"} },

  { id:"f3", ep:"GET /customers/search", cid:"c9f2a1-2a03",
    parent:"customer", child:"payment", fk:"payment.customer_id → customer.id",
    repeat:60, distinct:3, conf:"MEDIUM",
    sql:"select p1_0.id, p1_0.amount\nfrom payment p1_0\nwhere p1_0.customer_id = ?",
    binds:["7","7","7","12","…"],
    ai:"Tekrar var ama bağlanan değerlerin yalnızca 3'ü farklı — aynı müşteri defalarca sorgulanıyor. Bu N+1'den çok önbellek eksikliğine benziyor; düzeltme yeri sorgu değil, çağrı yeri olabilir.",
    fix:{action:"Aynı istek içinde tekrarlanan çağrıyı tekilleştir; gerekiyorsa ikinci seviye önbellek.",
         exp:"sorgu sayısı 60 → 3",
         risk:"Önbellek eklemek geçersizleşme sorumluluğu getirir.",
         alt:"Çağıran tarafta sonucu değişkende tut"} }
];


/* ══ durum ══════════════════════════════════════════════ */
let S={
  nav:"crud", route:{name:"proposals"},
  sort:{key:"no",dir:"asc"}, page:0, size:5, q:"", custTab:"liste",
  loading:false, form:{no:"",status:"DRAFT",date:"",premium:""}, errs:{},
  reqs:[], dockMin:false, slowOnly:false, openReq:null,
  aRunning:false, aStages:[], aDone:false, aOpen:null, aiOn:true, range:"son 15 dakika"
};
let T=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const money=n=>n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const clock=d=>d.toLocaleTimeString("tr-TR",{hour12:false});

/* ══ istek kaydı ════════════════════════════════════════ */
function call(path, key){
  const ms = Math.round((LAT[key||path]||30) * (0.9+Math.random()*0.2));
  S.reqs.unshift({
    at:new Date(), method:key&&key.startsWith("POST")?"POST":"GET",
    path, status:200, ms,
    cid:"c9f2a1-"+Math.random().toString(16).slice(2,6)
  });
  S.reqs=S.reqs.slice(0,40);
  S.loading=true; renderDock(); render();
  T.push(setTimeout(()=>{S.loading=false;render();}, Math.min(ms,700)));
  return ms;
}

/* ══ CRUD ekranları ═════════════════════════════════════ */
function sorted(rows){
  const {key,dir}=S.sort, m=dir==="asc"?1:-1;
  return [...rows].sort((a,b)=>(a[key]>b[key]?1:a[key]<b[key]?-1:0)*m);
}
function th(key,label,cls=""){
  const on=S.sort.key===key;
  return `<th class="sortable ${cls}" data-sort="${key}">${label}${on?`<span class="car">${S.sort.dir==="asc"?"▲":"▼"}</span>`:""}</th>`;
}
function skelRows(cols,n=5){
  return Array.from({length:n},()=>`<tr>${Array.from({length:cols},()=>`<td><span class="skel"></span></td>`).join("")}</tr>`).join("");
}
function pager(total){
  const pages=Math.ceil(total/S.size)||1;
  return `<div class="foot">
    <span>${total} kayıt · sayfa ${S.page+1}/${pages}</span>
    <div class="pager">
      <button data-page="prev" ${S.page===0?"disabled":""}>‹ önceki</button>
      <button data-page="next" ${S.page>=pages-1?"disabled":""}>sonraki ›</button>
    </div></div>`;
}

/* ══ dock ═══════════════════════════════════════════════ */
function renderDock(){
  const list=S.slowOnly?S.reqs.filter(r=>r.ms>300):S.reqs;
  const max=Math.max(...S.reqs.map(r=>r.ms),1);
  const tot=S.reqs.reduce((a,r)=>a+r.ms,0);
  $("#dockStat").textContent=S.reqs.length?`${S.reqs.length} çağrı · ${(tot/1000).toFixed(1)} sn`:"henüz istek yok";
  $("#dock").classList.toggle("min",S.dockMin);
  $("#caret").textContent=S.dockMin?"▶":"▼";
  $("#fSlow").classList.toggle("on",S.slowOnly);
  $("#dockBody").innerHTML=list.length?list.map((r,i)=>`
    <div class="req ${r.ms>300?"slow":""} ${S.openReq===i?"open":""}" data-req="${i}">
      <span class="mono" style="color:var(--ink-3)">${clock(r.at)}</span>
      <span class="m">${r.method}</span>
      <span class="p">${r.path}</span>
      <span class="s">${r.status}</span>
      <span class="track"><i style="width:${Math.max(2,r.ms/max*100)}%;background:${r.ms>300?"var(--heat)":"var(--calm)"}"></i></span>
      <span class="ms">${r.ms} ms</span>
      <span class="cid">X-Correlation-Id: ${r.cid}</span>
    </div>`).join(""):`<div class="empty" style="padding:22px"><b>İstek yok</b>CRUD ekranında gezinmeye başlayın.</div>`;
}

/* ══ render ═════════════════════════════════════════════ */
function render(){
  const v=$("#view");
  if(S.nav==="analiz"){v.innerHTML=viewAnaliz();return;}
  const r=S.route;
  v.innerHTML =
    r.name==="proposals"?viewProposals():
    r.name==="proposal" ?viewProposal(r.id):
    r.name==="customers"?viewCustomers():
    r.name==="customer" ?viewCustomer(r.id):
    viewNew();
}

/* ══ olaylar ════════════════════════════════════════════ */
let qTimer;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){
    clearTimeout(qTimer);
    const val=e.target.value;
    qTimer=setTimeout(()=>{S.q=val;S.page=0;call("/customers/search?city="+val,"/customers/search");},320);
  }
  if(["fno","fdt","fpr"].includes(e.target.id)){
    const map={fno:"no",fdt:"date",fpr:"premium"};
    S.form[map[e.target.id]]=e.target.value;
  }
  if(e.target.id==="fst") S.form.status=e.target.value;
});

document.addEventListener("click",e=>{
  const t=e.target;

  const nav=t.closest("[data-nav]");
  if(nav){S.nav=nav.dataset.nav;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b===nav));render();return;}

  const go=t.closest("[data-go]");
  if(go){
    const d=go.dataset.go;
    S.page=0;S.q="";
    if(d==="proposals"){S.route={name:"proposals"};call("/proposals");}
    if(d==="customers"){S.route={name:"customers"};S.custTab="liste";call("/customers");}
    if(d==="new"){S.route={name:"new"};S.errs={};render();}
    return;
  }

  const op=t.closest("[data-open-proposal]");
  if(op){S.route={name:"proposal",id:+op.dataset.openProposal};call("/proposals/"+op.dataset.openProposal,"/proposals/{id}");call("/proposals/detail");return;}

  const oc=t.closest("[data-open-customer]");
  if(oc){S.route={name:"customer",id:+oc.dataset.openCustomer};call("/customers/"+oc.dataset.openCustomer+"/payments","/customers/{id}/payments");return;}

  const tab=t.closest("[data-tab]");
  if(tab){
    S.custTab=tab.dataset.tab;S.page=0;
    call(S.custTab==="ozet"?"/customers/detail":"/customers");
    return;
  }

  const so=t.closest("[data-sort]");
  if(so){
    const k=so.dataset.sort;
    S.sort = S.sort.key===k?{key:k,dir:S.sort.dir==="asc"?"desc":"asc"}:{key:k,dir:"asc"};
    call(S.route.name==="customers"?"/customers":"/proposals");
    return;
  }

  const pg=t.closest("[data-page]");
  if(pg){
    S.page+= pg.dataset.page==="next"?1:-1;
    call(S.route.name==="customers"?"/customers":"/proposals");
    return;
  }

  if(t.id==="save"){
    const e2={};
    if(!S.form.no.trim()) e2.no="Teklif no zorunlu.";
    else if(!/^TEK-\d{4}-\d{6}$/.test(S.form.no.trim())) e2.no="Biçim TEK-YYYY-NNNNNN olmalı.";
    if(!S.form.date.trim()) e2.date="Tarih zorunlu.";
    else if(!/^\d{4}-\d{2}-\d{2}$/.test(S.form.date.trim())) e2.date="Tarih YYYY-AA-GG biçiminde girilmeli.";
    if(!S.form.premium.trim()) e2.premium="Prim zorunlu.";
    else if(!(Number(S.form.premium)>0)) e2.premium="Prim sıfırdan büyük olmalı.";
    S.errs=e2;
    if(Object.keys(e2).length){render();return;}
    S.saving=true;render();
    call("/proposals","POST /proposals");
    T.push(setTimeout(()=>{S.saving=false;S.route={name:"proposals"};S.form={no:"",status:"DRAFT",date:"",premium:""};call("/proposals");},700));
    return;
  }

  if(t.id==="dockToggle"||t.closest("#dockToggle")){S.dockMin=!S.dockMin;renderDock();return;}
  if(t.id==="fSlow"){S.slowOnly=!S.slowOnly;renderDock();return;}
  if(t.id==="fClear"){S.reqs=[];S.openReq=null;renderDock();return;}
  if(t.id==="fAnalyze"){
    S.nav="analiz";
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.nav==="analiz"));
    render();
    return;
  }

  const rq=t.closest("[data-req]");
  if(rq){const i=+rq.dataset.req;S.openReq=S.openReq===i?null:i;renderDock();return;}

  const rg=t.closest("[data-range]");
  if(rg){S.range=rg.dataset.range;render();return;}

  if(t.id==="runA"||t.closest("#runA")){runAnalysis();return;}

  const fd=t.closest("[data-finding]");
  if(fd){const id=fd.dataset.finding;S.aOpen=S.aOpen===id?null:id;render();return;}

  if(t.id==="aiToggle"||t.closest("#aiToggle")){S.aiOn=!S.aiOn;render();return;}

  if(t.hasAttribute&&t.hasAttribute("data-copy")){
    t.textContent="Kopyalandı";setTimeout(()=>t.textContent="Komutu kopyala",1400);
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("tr.click")) e.target.click();
});

function runAnalysis(){
  T.forEach(clearTimeout);T=[];
  S.aRunning=true;S.aDone=false;S.aStages=[];S.aOpen=null;render();
  let acc=0;
  STAGES.forEach((s,i)=>{
    T.push(setTimeout(()=>{S.aStages.push({...s,done:false});render();},acc/4));
    acc+=s.ms;
    T.push(setTimeout(()=>{
      S.aStages[i].done=true;
      if(i===STAGES.length-1){S.aRunning=false;S.aDone=true;}
      render();
    },acc/4));
  });
}

/* ══ açılış ═════════════════════════════════════════════ */
call("/proposals");
renderDock();
</script>
